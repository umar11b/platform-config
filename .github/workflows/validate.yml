name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Install conftest
        run: |
          VERSION=0.56.0
          curl -sLO "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz"
          tar xzf "conftest_${VERSION}_Linux_x86_64.tar.gz"
          sudo mv conftest /usr/local/bin/

      - name: Build manifests
        run: kustomize build base/helloworld -o /tmp/manifests.yaml

      - name: Policy checks
        run: conftest test /tmp/manifests.yaml --policy policy/ --all-namespaces

      - name: Policy unit tests
        run: conftest verify --policy policy/

  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Dry-run apply
        run: |
          # dry-run doesn't persist the Namespace, so create it for the namespaced objects
          kubectl create namespace helloworld
          kustomize build base/helloworld \
            | kubectl apply --dry-run=server -f -
