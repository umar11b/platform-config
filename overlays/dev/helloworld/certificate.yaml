apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: helloworld-tls
  namespace: istio-ingress
spec:
  secretName: helloworld-tls
  dnsNames:
    - hello.lab.DOMAIN.com  # replace with your domain
    - "*.lab.DOMAIN.com"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
