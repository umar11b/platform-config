apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 84.5.0
    helm:
      values: |
        # GKE manages the control plane — these exporters won't scrape anything useful
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 7d
            serviceMonitorNamespaceSelector: {}
            serviceMonitorSelector: {}
            ruleNamespaceSelector: {}
            resources:
              requests:
                cpu: 200m
                memory: 400Mi
              limits:
                cpu: 500m
                memory: 1Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
        grafana:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          adminPassword: ""
          grafana.ini:
            auth.anonymous:
              enabled: true
              org_role: Viewer
        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ['alertname', 'slo']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: discord
            receivers:
              - name: discord
                discord_configs:
                  - webhook_url: 'DISCORD_WEBHOOK_URL'
                    title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
                    message: |
                      {{ range .Alerts }}
                      **{{ .Annotations.summary }}**
                      {{ .Annotations.description }}
                      {{ end }}
          alertmanagerSpec:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
